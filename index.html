<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marco Brandfer - Official Web App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans selection:bg-red-600 selection:text-white pb-12">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function MarcoBrandferApp() {
      const [currentPlayingId, setCurrentPlayingId] = useState(null);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      
      const [isRegistered, setIsRegistered] = useState(false);
      const [email, setEmail] = useState('');
      const [comments, setComments] = useState([]);
      const [newComment, setNewComment] = useState('');
      const [userName, setUserName] = useState('');
      const [activeFansCount, setActiveFansCount] = useState(0);
      const [downloadCounts, setDownloadCounts] = useState({});
      const [copiedPix, setCopiedPix] = useState(false);
      const [isSubmittingEmail, setIsSubmittingEmail] = useState(false);
      const [isSubmittingComment, setIsSubmittingComment] = useState(false);

      const audioRef = useRef(null);
      const vipSectionRef = useRef(null);

      // URL do SheetDB Integrada
      const SHEETDB_URL = "https://sheetdb.io/api/v1/fh1x3fe0dd2ko"; 

      // Chave Pix Oficial
      const pixKey = "brandfer@hotmail.com"; 

      // Links das Redes Oficiais
      const socialLinks = {
        instagram: "https://www.instagram.com/markobrandfer",
        youtube: "https://www.youtube.com/@Brandfer",
        kofi: "https://ko-fi.com/marcobrandfer"
      };

      // Músicas com as capas e arquivos ajustados
      const tracks = [
        {
          id: 'guardian',
          title: 'The Guardian of Hidden Wisdom',
          subtitle: 'Single Oficial #1',
          cover: './images/capaguardian.jpg',
          audioPreview: './audios/Marco Brandfer - The Guardian of Hidden Wisdom.mp3',
          downloadZip: './downloads/Marco Brandfer - The Guardian of Hidden Wisdom.zip'
        },
        {
          id: 'raining_tears',
          title: 'Raining Tears',
          subtitle: 'Single Oficial #2',
          cover: './images/caparaining.jpg',
          audioPreview: './audios/Marco Brandfer - Raining Tears.mp3',
          downloadZip: './downloads/Marco Brandfer - Raining Tears.zip'
        },
        {
          id: 'dark_clouds',
          title: 'Dark Clouds',
          subtitle: 'Single Oficial #3',
          cover: './images/capadarkclouds.jpg',
          audioPreview: './audios/Marco Brandfer - Dark Clouds.mp3',
          downloadZip: './downloads/Marco Brandfer - Dark Clouds.zip'
        }
      ];

      // Áudio de Introdução da Hero Section
      const introAudio = {
        id: 'hero_intro',
        audioPreview: './audios/guardian.mp3'
      };

      // Recarregar ícones Lucide sempre que a interface renderizar
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Carregar dados iniciais da planilha
      useEffect(() => {
        if (SHEETDB_URL) {
          fetch(`${SHEETDB_URL}?sheet=Comments`)
            .then(res => res.json())
            .then(data => { if (Array.isArray(data)) setComments(data.reverse()); })
            .catch(err => console.error("Erro ao carregar comentários:", err));

          fetch(`${SHEETDB_URL}?sheet=Vip_Fans`)
            .then(res => res.json())
            .then(data => { if (Array.isArray(data)) setActiveFansCount(data.length); })
            .catch(err => console.error("Erro ao carregar lista VIP:", err));

          fetch(`${SHEETDB_URL}?sheet=Downloads`)
            .then(res => res.json())
            .then(data => {
              if (Array.isArray(data)) {
                const counts = {};
                data.forEach(item => {
                  if (item.song) counts[item.song] = (counts[item.song] || 0) + 1;
                });
                setDownloadCounts(counts);
              }
            })
            .catch(err => console.error("Erro ao carregar métricas de downloads:", err));
        }
      }, []);

      // Controladores de Áudio e Progresso
      const togglePlayTrack = (trackId, audioSrc) => {
        if (currentPlayingId === trackId) {
          if (audioRef.current) audioRef.current.pause();
          setCurrentPlayingId(null);
        } else {
          if (audioRef.current) {
            audioRef.current.src = audioSrc;
            audioRef.current.play();
          }
          setCurrentPlayingId(trackId);
        }
      };

      const handleTimeUpdate = () => {
        if (audioRef.current) {
          setCurrentTime(audioRef.current.currentTime);
          setDuration(audioRef.current.duration || 0);
        }
      };

      const handleSeek = (e) => {
        const newTime = parseFloat(e.target.value);
        if (audioRef.current) {
          audioRef.current.currentTime = newTime;
          setCurrentTime(newTime);
        }
      };

      const formatTime = (secs) => {
        if (isNaN(secs)) return "0:00";
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        if (!email) return;

        setIsSubmittingEmail(true);
        const today = new Date().toLocaleDateString('pt-BR');

        try {
          if (SHEETDB_URL) {
            await fetch(`${SHEETDB_URL}?sheet=Vip_Fans`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: [{ email: email, date: today }] })
            });
          }
          setIsRegistered(true);
          setActiveFansCount(prev => prev + 1);
        } catch (err) {
          console.error("Erro ao salvar email:", err);
          setIsRegistered(true);
        } finally {
          setIsSubmittingEmail(false);
        }
      };

      const handleTrackDownloadClick = async (trackId) => {
        if (!isRegistered) {
          if (vipSectionRef.current) {
            vipSectionRef.current.scrollIntoView({ behavior: 'smooth' });
          }
          return;
        }

        const today = new Date().toLocaleDateString('pt-BR');

        setDownloadCounts(prev => ({
          ...prev,
          [trackId]: (prev[trackId] || 0) + 1
        }));

        try {
          if (SHEETDB_URL) {
            await fetch(`${SHEETDB_URL}?sheet=Downloads`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: [{ song: trackId, date: today }] })
            });
          }
        } catch (err) {
          console.error("Erro ao registrar estatística de download:", err);
        }
      };

      const getRockAvatar = (name) => {
        const cleanName = encodeURIComponent(name.trim().toLowerCase());
        return `https://api.dicebear.com/7.x/bottts/svg?seed=${cleanName}&backgroundColor=000000,b91c1c,171717`;
      };

      const handleAddComment = async (e) => {
        e.preventDefault();
        if (!newComment.trim() || !userName.trim()) return;

        setIsSubmittingComment(true);
        const avatarUrl = getRockAvatar(userName);
        const today = new Date().toLocaleDateString('pt-BR');
        const commentObj = {
          name: userName,
          text: newComment,
          date: today,
          avatar: avatarUrl
        };

        try {
          if (SHEETDB_URL) {
            await fetch(`${SHEETDB_URL}?sheet=Comments`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: [commentObj] })
            });
          }
          setComments([commentObj, ...comments]);
          setNewComment('');
          setUserName('');
        } catch (err) {
          console.error("Erro ao postar comentário:", err);
        } finally {
          setIsSubmittingComment(false);
        }
      };

      const copyPixToClipboard = () => {
        navigator.clipboard.writeText(pixKey);
        setCopiedPix(true);
        setTimeout(() => setCopiedPix(false), 3000);
      };

      return (
        <div className="min-h-screen">
          
          <audio 
            ref={audioRef} 
            onTimeUpdate={handleTimeUpdate} 
            onEnded={() => { setCurrentPlayingId(null); setCurrentTime(0); }}
          ></audio>

          {/* Sticky Header */}
          <header className="sticky top-0 z-50 bg-neutral-900/90 backdrop-blur-md border-b border-neutral-800 px-4 py-3 flex justify-between items-center">
            <div className="flex items-center gap-2">
              <i data-lucide="disc" className="w-6 h-6 text-red-600 animate-spin"></i>
              <span className="font-extrabold tracking-wider text-lg uppercase bg-gradient-to-r from-white via-neutral-200 to-neutral-400 bg-clip-text text-transparent">
                Marco Brandfer <span className="text-red-600 text-xs px-2 py-0.5 border border-red-600 rounded-full">APP</span>
              </span>
            </div>
            
            <div className="flex items-center gap-3">
              <a href={socialLinks.instagram} target="_blank" rel="noopener noreferrer" className="text-neutral-400 hover:text-white transition">
                <i data-lucide="instagram" className="w-5 h-5"></i>
              </a>
              <a href={socialLinks.youtube} target="_blank" rel="noopener noreferrer" className="text-neutral-400 hover:text-red-500 transition">
                <i data-lucide="youtube" className="w-5 h-5"></i>
              </a>
              <a href="#support" className="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-full font-bold transition ml-2">
                Apoiar
              </a>
            </div>
          </header>

          {/* Item 3: Banner Hero com Mensagem Falada e Foto */}
          <section className="max-w-5xl mx-auto mt-6 px-4">
            <div className="relative bg-gradient-to-r from-neutral-900 via-neutral-900/90 to-neutral-950 border border-neutral-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row items-center">
              
              {/* Arte da Foto de Capa / Hero */}
              <div className="w-full md:w-1/2 aspect-video md:aspect-square relative overflow-hidden bg-neutral-950">
                <img 
                  src="./images/superiorguardian.jpg" 
                  alt="Marco Brandfer" 
                  className="w-full h-full object-cover object-center"
                />
                <div className="absolute inset-0 bg-gradient-to-t from-neutral-950 md:bg-gradient-to-r md:from-transparent md:to-neutral-900"></div>
              </div>

              {/* Conteúdo e Player de Chamada */}
              <div className="w-full md:w-1/2 p-6 md:p-10 space-y-4">
                <span className="text-xs uppercase tracking-widest font-bold text-red-500 flex items-center gap-2">
                  <i data-lucide="volume-2" className="w-4 h-4"></i> Qual a Chave da Sabedoria Oculta? 
                </span>
                
                <h2 className="text-2xl md:text-3xl font-black uppercase leading-tight text-white">
                  "Only the worthy may cross the line..."
                </h2>
                
                <p className="text-xs md:text-sm text-neutral-400 leading-relaxed">
                  Ouça agora <strong className="text-neutral-200">The Guardian of Hidden Wisdom</strong> e descubra a história por trás deste lançamento.
                </p>

                {/* Botão de Play de Chamada */}
                <div className="pt-2">
                  <button 
                    onClick={() => togglePlayTrack(introAudio.id, introAudio.audioPreview)}
                    className="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-extrabold px-6 py-3.5 rounded-2xl transition flex items-center justify-center gap-3 shadow-lg shadow-red-950/50 group"
                  >
                    <i data-lucide={currentPlayingId === introAudio.id ? "pause" : "play"} className="w-5 h-5 fill-white group-hover:scale-110 transition"></i>
                    <span>{currentPlayingId === introAudio.id ? "Pausar Mensagem" : "Click e ouça"}</span>
                  </button>
                </div>
              </div>

            </div>
          </section>

          {/* Vitrine de Novos Lançamentos */}
          <section className="max-w-5xl mx-auto my-12 px-4 space-y-6">
            <div className="text-center space-y-2">
              <h1 className="text-3xl font-black uppercase tracking-tight">Novos Lançamentos</h1>
              <p className="text-xs text-neutral-400 max-w-md mx-auto">
                Ouça a prévia exclusiva de cada faixa abaixo e faça o download completo em alta qualidade.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {tracks.map((track) => {
                const isThisPlaying = currentPlayingId === track.id;
                const count = downloadCounts[track.id] || 0;

                return (
                  <div key={track.id} className="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden flex flex-col justify-between shadow-xl group hover:border-red-900/50 transition">
                    <div>
                      {/* Cover & Download Count */}
                      <div className="relative aspect-square overflow-hidden bg-neutral-950">
                        <img 
                          src={track.cover} 
                          alt={track.title} 
                          className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-neutral-950 via-transparent to-transparent"></div>
                        
                        <span className="absolute top-3 left-3 bg-neutral-950/80 backdrop-blur-md text-[10px] font-mono text-neutral-300 border border-neutral-800 px-2.5 py-1 rounded-full flex items-center gap-1">
                          <i data-lucide="download" className="w-3 h-3 text-red-500"></i> {count} Downloads
                        </span>
                      </div>

                      {/* Informações e Mini Player Integrado */}
                      <div className="p-4 space-y-3">
                        <div>
                          <span className="text-[10px] uppercase font-bold text-red-500 tracking-wider">{track.subtitle}</span>
                          <h3 className="font-bold text-base text-white line-clamp-1">{track.title}</h3>
                        </div>

                        {/* Player Interativo com Alternância Play / Pause */}
                        <div className="bg-neutral-950/80 border border-neutral-800/80 rounded-xl p-3 space-y-2">
                          <div className="flex items-center gap-3">
                            <button 
                              onClick={() => togglePlayTrack(track.id, track.audioPreview)}
                              className="bg-red-600 hover:bg-red-700 text-white p-2.5 rounded-full transition flex-shrink-0 flex items-center justify-center shadow-md shadow-red-950"
                            >
                              <i data-lucide={isThisPlaying ? "pause" : "play"} className="w-4 h-4 fill-white"></i>
                            </button>
                            
                            <div className="flex-1 space-y-1">
                              <input 
                                type="range" 
                                min="0" 
                                max={isThisPlaying ? duration || 100 : 100}
                                value={isThisPlaying ? currentTime : 0}
                                onChange={isThisPlaying ? handleSeek : undefined}
                                disabled={!isThisPlaying}
                                className="w-full h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-red-600 disabled:opacity-40"
                              />
                              
                              <div className="flex justify-between text-[10px] font-mono text-neutral-400">
                                <span>{isThisPlaying ? formatTime(currentTime) : "0:00"}</span>
                                <span>{isThisPlaying && duration ? formatTime(duration) : "Prévia"}</span>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Botões de Ação Atualizados: Desbloquear Download Grátis e Apoiar */}
                    <div className="p-4 pt-0 space-y-2">
                      <a 
                        href={isRegistered ? track.downloadZip : "#vip"}
                        download={isRegistered ? `${track.title}.zip` : undefined}
                        onClick={() => handleTrackDownloadClick(track.id)}
                        className={`w-full py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition ${
                          isRegistered 
                            ? 'bg-neutral-100 hover:bg-white text-black' 
                            : 'bg-neutral-800 hover:bg-neutral-700 text-neutral-300 border border-neutral-700'
                        }`}
                      >
                        <i data-lucide={isRegistered ? "download" : "lock"} className="w-4 h-4"></i>
                        <span>{isRegistered ? 'Baixar Faixa (.ZIP)' : 'Desbloquear Download Grátis'}</span>
                      </a>

                      <a 
                        href="#support" 
                        className="w-full py-2 rounded-xl font-bold text-xs bg-transparent hover:bg-neutral-800/80 text-neutral-400 hover:text-white border border-neutral-800 flex items-center justify-center gap-2 transition"
                      >
                        <i data-lucide="handshake" className="w-4 h-4 text-red-500"></i>
                        <span>Apoiar Projeto</span>
                      </a>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {/* VIP Access Section */}
          <section id="vip" ref={vipSectionRef} className="max-w-3xl mx-auto my-12 px-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 relative overflow-hidden">
              <div className="flex justify-between items-center mb-4">
                <div className="flex items-center gap-3">
                  <i data-lucide="music" className="text-red-500 w-6 h-6"></i>
                  <h2 className="text-xl md:text-2xl font-bold">VIP Fan Area & Downloads</h2>
                </div>
                <span className="text-xs bg-neutral-800 text-neutral-300 border border-neutral-700 px-3 py-1 rounded-full font-mono">
                  🔥 {activeFansCount} Active Fans
                </span>
              </div>

              {!isRegistered ? (
                <div className="space-y-4">
                  <p className="text-neutral-400 text-sm">
                    Cadastre seu e-mail para ter acesso VIP e desbloquear o download grátis de todos os singles em alta qualidade.
                  </p>
                  <form onSubmit={handleRegister} className="flex flex-col sm:flex-row gap-3 pt-2">
                    <input 
                      type="email" 
                      required
                      placeholder="Digite seu melhor e-mail" 
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="bg-neutral-950 border border-neutral-800 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-red-600 flex-1 text-sm"
                    />
                    <button 
                      type="submit" 
                      disabled={isSubmittingEmail}
                      className="bg-red-600 hover:bg-red-700 font-bold px-6 py-3 rounded-xl transition text-sm flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      <span>{isSubmittingEmail ? 'Liberando...' : 'Desbloquear Downloads'}</span>
                    </button>
                  </form>
                </div>
              ) : (
                <div className="bg-neutral-950/80 border border-green-500/30 p-4 rounded-xl space-y-2">
                  <div className="flex items-center gap-2 text-green-400 font-bold text-sm">
                    <i data-lucide="user-check" className="w-5 h-5"></i> Acesso VIP Liberado!
                  </div>
                  <p className="text-xs text-neutral-400">
                    Você já possui acesso liberado. Escolha qualquer uma das músicas nos cards acima para realizar o download direto do arquivo .ZIP.
                  </p>
                </div>
              )}
            </div>
          </section>

          {/* Support Section */}
          <section id="support" className="max-w-3xl mx-auto my-12 px-4 space-y-6">
            <div className="text-center space-y-2">
              <h2 className="text-2xl font-bold uppercase tracking-tight">Apoie o Projeto</h2>
              <p className="text-xs text-neutral-400 max-w-md mx-auto">
                Ajude a manter a produção de Heavy Metal independente ativa. Escolha a melhor plataforma abaixo para apoiar os próximos lançamentos!
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 flex flex-col justify-between space-y-4">
                <div className="space-y-2">
                  <div className="flex items-center gap-2 text-amber-500 font-bold text-sm">
                    <i data-lucide="coffee" className="w-5 h-5"></i> International Support
                  </div>
                  <h3 className="font-bold text-base text-white">Buy me a coffee on Ko-fi ☕</h3>
                  <p className="text-xs text-neutral-400">Apoio internacional diretamente via Ko-fi em USD/EUR.</p>
                </div>
                <a 
                  href={socialLinks.kofi} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="w-full bg-amber-500 hover:bg-amber-600 text-black font-extrabold text-xs py-3 rounded-xl transition text-center flex items-center justify-center gap-2"
                >
                  <span>Apoiar via Ko-fi</span>
                  <i data-lucide="external-link" className="w-4 h-4"></i>
                </a>
              </div>

              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 flex flex-col justify-between space-y-4">
                <div className="space-y-2">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold text-sm">
                    <i data-lucide="qr-code" className="w-5 h-5"></i> Apoio Nacional (Brasil)
                  </div>
                  <h3 className="font-bold text-base text-white">Contribuição via Pix 🇧🇷</h3>
                  <p className="text-xs text-neutral-400">Copie a chave Pix abaixo para enviar qualquer valor de apoio.</p>
                </div>
                
                <div className="space-y-2">
                  <div className="bg-neutral-950 border border-neutral-800 px-3 py-2 rounded-lg text-xs font-mono text-neutral-300 truncate">
                    {pixKey}
                  </div>
                  <button 
                    onClick={copyPixToClipboard}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-2"
                  >
                    <i data-lucide={copiedPix ? "check" : "copy"} className="w-4 h-4"></i>
                    <span>{copiedPix ? 'Chave Pix Copiada!' : 'Copiar Chave Pix'}</span>
                  </button>
                </div>
              </div>
            </div>
          </section>

          {/* Comments Section */}
          <section className="max-w-3xl mx-auto my-12 px-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 space-y-6">
              <div className="flex items-center gap-3 border-b border-neutral-800 pb-4">
                <i data-lucide="message-square" className="text-red-500 w-6 h-6"></i>
                <div>
                  <h2 className="text-xl font-bold">Mural dos Fãs & Comunidade</h2>
                  <p className="text-xs text-neutral-400">O que achou das novas músicas? Deixe seu comentário abaixo!</p>
                </div>
              </div>

              <form onSubmit={handleAddComment} className="space-y-3">
                <input 
                  type="text" 
                  required
                  placeholder="Seu Nome ou Nick (ex: MetalVocalist)"
                  value={userName}
                  onChange={(e) => setUserName(e.target.value)}
                  className="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-red-600 text-sm"
                />
                <textarea 
                  required
                  rows="3"
                  placeholder="Conte o que você achou das faixas..."
                  value={newComment}
                  onChange={(e) => setNewComment(e.target.value)}
                  className="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-red-600 text-sm"
                ></textarea>
                <button 
                  type="submit" 
                  disabled={isSubmittingComment}
                  className="bg-red-600 hover:bg-red-700 font-bold px-6 py-2.5 rounded-xl text-xs transition uppercase tracking-wider flex items-center gap-2 disabled:opacity-50"
                >
                  <i data-lucide="send" className="w-3.5 h-3.5"></i>
                  <span>{isSubmittingComment ? 'Enviando...' : 'Publicar Comentário'}</span>
                </button>
              </form>

              <div className="space-y-3 pt-2">
                {comments.length === 0 ? (
                  <p className="text-xs text-neutral-500 italic">Nenhum comentário ainda. Seja o primeiro a comentar!</p>
                ) : (
                  comments.map((item, index) => (
                    <div key={index} className="bg-neutral-950 p-4 rounded-xl border border-neutral-800/60 flex gap-3.5 items-start">
                      <div className="w-10 h-10 rounded-xl bg-neutral-900 border border-neutral-800 p-1 flex-shrink-0 overflow-hidden">
                        <img 
                          src={item.avatar || getRockAvatar(item.name)} 
                          alt={item.name} 
                          className="w-full h-full object-contain"
                        />
                      </div>
                      <div className="flex-1 space-y-1">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-xs text-red-500">{item.name}</span>
                          <span className="text-[10px] text-neutral-500">{item.date}</span>
                        </div>
                        <p className="text-xs text-neutral-300 leading-relaxed">{item.text}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </section>

          {/* Item 1: Rodapé com Ícones das Redes Sociais */}
          <footer className="max-w-4xl mx-auto mt-16 px-4 pt-8 border-t border-neutral-800 text-center space-y-6">
            <div className="flex justify-center items-center gap-8">
              <a 
                href={socialLinks.instagram} 
                target="_blank" 
                rel="noopener noreferrer" 
                className="text-neutral-400 hover:text-white transition flex items-center gap-2 text-xs font-bold"
              >
                <i data-lucide="instagram" className="w-5 h-5 text-red-500"></i> Instagram
              </a>

              <a 
                href={socialLinks.youtube} 
                target="_blank" 
                rel="noopener noreferrer" 
                className="text-neutral-400 hover:text-red-500 transition flex items-center gap-2 text-xs font-bold"
              >
                <i data-lucide="youtube" className="w-5 h-5 text-red-500"></i> YouTube (@Brandfer)
              </a>

              <a 
                href={socialLinks.kofi} 
                target="_blank" 
                rel="noopener noreferrer" 
                className="text-neutral-400 hover:text-amber-400 transition flex items-center gap-2 text-xs font-bold"
              >
                <i data-lucide="coffee" className="w-5 h-5 text-amber-500"></i> Ko-fi
              </a>
            </div>

            <p className="text-xs text-neutral-500">© 2026 Marco Brandfer. All rights reserved.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MarcoBrandferApp />);
  </script>
</body>
</html>
