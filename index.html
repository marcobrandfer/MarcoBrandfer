<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marco Brandfer - Official Web App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans selection:bg-red-600 selection:text-white pb-12">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function MarcoBrandferApp() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [isRegistered, setIsRegistered] = useState(false);
      const [email, setEmail] = useState('');
      const [comments, setComments] = useState([]);
      const [newComment, setNewComment] = useState('');
      const [userName, setUserName] = useState('');
      const [activeFansCount, setActiveFansCount] = useState(0);
      const [copiedPix, setCopiedPix] = useState(false);
      const [isSubmittingEmail, setIsSubmittingEmail] = useState(false);
      const [isSubmittingComment, setIsSubmittingComment] = useState(false);

      const audioRef = useRef(null);

      // ⚠️ COLE A URL DO SEU SHEETDB AQUI ABAIXO:
      const SHEETDB_URL = "https://sheetdb.io/api/v1/fh1x3fe0dd2ko"; 

      // Chave Pix Oficial
      const pixKey = "brandfer@hotmail.com"; 

      // Links das Redes Oficiais
      const socialLinks = {
        instagram: "https://www.instagram.com/markobrandfer",
        youtube: "https://www.youtube.com/@Brandfer",
        kofi: "https://ko-fi.com/marcobrandfer"
      };

      // Carregar comentários e contagem diretamente do Google Sheets
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }

        // Carregar comentários da aba "Comments"
        if (SHEETDB_URL && !SHEETDB_URL.includes("SUA_URL_DO_SHEETDB_AQUI")) {
          fetch(`${SHEETDB_URL}?sheet=Comments`)
            .then(res => res.json())
            .then(data => {
              if (Array.isArray(data)) {
                setComments(data.reverse()); // Exibe os mais recentes primeiro
              }
            })
            .catch(err => console.error("Erro ao carregar comentários:", err));

          // Contar fãs cadastrados na aba "VIP_Fans"
          fetch(`${SHEETDB_URL}?sheet=VIP_Fans`)
            .then(res => res.json())
            .then(data => {
              if (Array.isArray(data)) {
                setActiveFansCount(data.length);
              }
            })
            .catch(err => console.error("Erro ao carregar lista VIP:", err));
        }
      }, [copiedPix]);

      const togglePlay = () => {
        if (audioRef.current) {
          if (isPlaying) {
            audioRef.current.pause();
          } else {
            audioRef.current.play();
          }
          setIsPlaying(!isPlaying);
        }
      };

      // Cadastrar e-mail VIP na planilha
      const handleRegister = async (e) => {
        e.preventDefault();
        if (!email) return;

        setIsSubmittingEmail(true);
        const today = new Date().toLocaleDateString('pt-BR');

        try {
          if (SHEETDB_URL && !SHEETDB_URL.includes("SUA_URL_DO_SHEETDB_AQUI")) {
            await fetch(`${SHEETDB_URL}?sheet=VIP_Fans`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                data: [{ email: email, date: today }]
              })
            });
          }
          setIsRegistered(true);
          setActiveFansCount(prev => prev + 1);
        } catch (err) {
          console.error("Erro ao salvar email:", err);
          setIsRegistered(true); // Permite download mesmo se der erro
        } finally {
          setIsSubmittingEmail(false);
        }
      };

      // Gerador de Avatar Estilizado
      const getRockAvatar = (name) => {
        const cleanName = encodeURIComponent(name.trim().toLowerCase());
        return `https://api.dicebear.com/7.x/bottts/svg?seed=${cleanName}&backgroundColor=000000,b91c1c,171717`;
      };

      // Postar comentário no Google Sheets
      const handleAddComment = async (e) => {
        e.preventDefault();
        if (!newComment.trim() || !userName.trim()) return;

        setIsSubmittingComment(true);
        const avatarUrl = getRockAvatar(userName);
        const today = new Date().toLocaleDateString('pt-BR');
        const commentObj = {
          name: userName,
          text: newComment,
          date: today,
          avatar: avatarUrl
        };

        try {
          if (SHEETDB_URL && !SHEETDB_URL.includes("SUA_URL_DO_SHEETDB_AQUI")) {
            await fetch(`${SHEETDB_URL}?sheet=Comments`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: [commentObj] })
            });
          }
          setComments([commentObj, ...comments]);
          setNewComment('');
          setUserName('');
        } catch (err) {
          console.error("Erro ao postar comentário:", err);
        } finally {
          setIsSubmittingComment(false);
        }
      };

      const copyPixToClipboard = () => {
        navigator.clipboard.writeText(pixKey);
        setCopiedPix(true);
        setTimeout(() => setCopiedPix(false), 3000);
      };

      return (
        <div class="min-h-screen">
          
          {/* Audio Player Component */}
          <audio ref={audioRef} src="./audios/guardian.mp3" onEnded={() => setIsPlaying(false)}></audio>

          {/* Sticky Header */}
          <header class="sticky top-0 z-50 bg-neutral-900/90 backdrop-blur-md border-b border-neutral-800 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
              <i data-lucide="disc" class="w-6 h-6 text-red-600 animate-spin"></i>
              <span class="font-extrabold tracking-wider text-lg uppercase bg-gradient-to-r from-white via-neutral-200 to-neutral-400 bg-clip-text text-transparent">
                Marco Brandfer <span class="text-red-600 text-xs px-2 py-0.5 border border-red-600 rounded-full">APP</span>
              </span>
            </div>
            
            {/* Social Buttons Navigation */}
            <div class="flex items-center gap-3">
              <a href={socialLinks.instagram} target="_blank" rel="noopener noreferrer" class="text-neutral-400 hover:text-white transition">
                <i data-lucide="instagram" class="w-5 h-5"></i>
              </a>
              <a href={socialLinks.youtube} target="_blank" rel="noopener noreferrer" class="text-neutral-400 hover:text-red-500 transition">
                <i data-lucide="youtube" class="w-5 h-5"></i>
              </a>
              <a href="#support" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-full font-bold transition ml-2">
                Support
              </a>
            </div>
          </header>

          {/* Hero Section */}
          <section class="relative bg-neutral-900 border-b border-neutral-800 py-16 px-4 text-center overflow-hidden">
            <div class="relative z-20 max-w-2xl mx-auto space-y-4">
              <span class="inline-flex items-center gap-1.5 text-xs uppercase tracking-widest text-red-500 font-semibold px-3 py-1 bg-red-950/50 border border-red-800 rounded-full">
                🔥 Exclusive Release
              </span>
              <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tight text-white">
                The Guardian of the Hidden Wisdom
              </h1>
              <p class="text-neutral-400 text-sm md:text-base max-w-md mx-auto">
                Listen to the brand-new exclusive track by Marco Brandfer, available first on this Web App.
              </p>
              
              {/* Audio Controls */}
              <div class="pt-4 flex justify-center">
                <button 
                  onClick={togglePlay}
                  class="flex items-center gap-3 bg-red-600 hover:bg-red-700 text-white font-bold px-8 py-3.5 rounded-full transition shadow-lg shadow-red-900/30"
                >
                  <i data-lucide={isPlaying ? "pause" : "play"} class="w-5 h-5 fill-white"></i>
                  <span>{isPlaying ? 'Pause Track' : 'Listen to "The Guardian of the Hidden Wisdom"'}</span>
                </button>
              </div>
            </div>
          </section>

          {/* VIP Access & Email Lead Capture */}
          <section id="vip" class="max-w-3xl mx-auto my-12 px-4">
            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 relative overflow-hidden">
              <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                  <i data-lucide="music" class="text-red-500 w-6 h-6"></i>
                  <h2 class="text-xl md:text-2xl font-bold">VIP Fan Area & Downloads</h2>
                </div>
                <span class="text-xs bg-neutral-800 text-neutral-300 border border-neutral-700 px-3 py-1 rounded-full font-mono">
                  🔥 {activeFansCount} Active Fans
                </span>
              </div>

              {!isRegistered ? (
                <div class="space-y-4">
                  <p class="text-neutral-400 text-sm">
                    Enter your email to join the VIP list and unlock the instant download of <strong>The Guardian of the Hidden Wisdom</strong> (.ZIP).
                  </p>
                  <form onSubmit={handleRegister} class="flex flex-col sm:flex-row gap-3 pt-2">
                    <input 
                      type="email" 
                      required
                      placeholder="Enter your best email" 
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      class="bg-neutral-950 border border-neutral-800 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-red-600 flex-1 text-sm"
                    />
                    <button 
                      type="submit" 
                      disabled={isSubmittingEmail}
                      class="bg-red-600 hover:bg-red-700 font-bold px-6 py-3 rounded-xl transition text-sm flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      <span>{isSubmittingEmail ? 'Unlocking...' : 'Unlock Download'}</span>
                    </button>
                  </form>
                </div>
              ) : (
                <div class="bg-neutral-950/80 border border-green-500/30 p-4 rounded-xl space-y-3">
                  <div class="flex items-center gap-2 text-green-400 font-bold text-sm">
                    <i data-lucide="user-check" class="w-5 h-5"></i> VIP Access Granted!
                  </div>
                  <p class="text-xs text-neutral-400">
                    Your exclusive download package is ready. Click the button below to get your high-quality files.
                  </p>
                  <a 
                    href="./downloads/guardian.zip" 
                    download="The_Guardian_of_the_Hidden_Wisdom.zip"
                    class="inline-flex items-center gap-2 bg-neutral-100 hover:bg-white text-black font-bold text-xs px-4 py-2.5 rounded-lg transition"
                  >
                    <i data-lucide="download" class="w-4 h-4"></i> Download Full Single (.ZIP)
                  </a>
                </div>
              )}
            </div>
          </section>

          {/* Support Section: Ko-fi & Pix */}
          <section id="support" class="max-w-3xl mx-auto my-12 px-4 space-y-6">
            <div class="text-center space-y-2">
              <h2 class="text-2xl font-bold uppercase tracking-tight">Support My Work</h2>
              <p class="text-xs text-neutral-400 max-w-md mx-auto">
                Help keep independent Heavy Metal music alive. Choose your preferred platform below to support future releases!
              </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              
              {/* International Support: Ko-fi */}
              <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 flex flex-col justify-between space-y-4">
                <div class="space-y-2">
                  <div class="flex items-center gap-2 text-amber-500 font-bold text-sm">
                    <i data-lucide="coffee" class="w-5 h-5"></i> International Support
                  </div>
                  <h3 class="font-bold text-base text-white">Buy me a coffee on Ko-fi ☕</h3>
                  <p class="text-xs text-neutral-400">
                    Support directly in USD/EUR from anywhere in the world.
                  </p>
                </div>
                <a 
                  href={socialLinks.kofi} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  class="w-full bg-amber-500 hover:bg-amber-600 text-black font-extrabold text-xs py-3 rounded-xl transition text-center flex items-center justify-center gap-2"
                >
                  <span>Click Here :: Ko-fi :: Click Here</span>
                  <i data-lucide="external-link" class="w-4 h-4"></i>
                </a>
              </div>

              {/* National Support: Pix (Brasil) */}
              <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 flex flex-col justify-between space-y-4">
                <div class="space-y-2">
                  <div class="flex items-center gap-2 text-emerald-400 font-bold text-sm">
                    <i data-lucide="qr-code" class="w-5 h-5"></i> Apoio Nacional (Brasil)
                  </div>
                  <h3 class="font-bold text-base text-white">Contribuição via Pix 🇧🇷</h3>
                  <p class="text-xs text-neutral-400">
                    Copie a chave Pix abaixo para enviar qualquer valor de apoio ao projeto.
                  </p>
                </div>
                
                <div class="space-y-2">
                  <div class="bg-neutral-950 border border-neutral-800 px-3 py-2 rounded-lg text-xs font-mono text-neutral-300 truncate">
                    {pixKey}
                  </div>
                  <button 
                    onClick={copyPixToClipboard}
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-2"
                  >
                    <i data-lucide={copiedPix ? "check" : "copy"} class="w-4 h-4"></i>
                    <span>{copiedPix ? 'Chave Pix Copiada!' : 'Copiar Chave Pix'}</span>
                  </button>
                </div>
              </div>

            </div>
          </section>

          {/* Fan Feedback & Comments Section */}
          <section class="max-w-3xl mx-auto my-12 px-4">
            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 space-y-6">
              <div class="flex items-center gap-3 border-b border-neutral-800 pb-4">
                <i data-lucide="message-square" class="text-red-500 w-6 h-6"></i>
                <div>
                  <h2 class="text-xl font-bold">Fan Comments & Community</h2>
                  <p class="text-xs text-neutral-400">What did you think of the new song? Post below and get your metal avatar!</p>
                </div>
              </div>

              {/* Comment Input Form */}
              <form onSubmit={handleAddComment} class="space-y-3">
                <input 
                  type="text" 
                  required
                  placeholder="Your Name or Handle (ex: MetalVocalist)"
                  value={userName}
                  onChange={(e) => setUserName(e.target.value)}
                  class="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-red-600 text-sm"
                />
                <textarea 
                  required
                  rows="3"
                  placeholder="Tell us what you felt listening to this track..."
                  value={newComment}
                  onChange={(e) => setNewComment(e.target.value)}
                  class="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-red-600 text-sm"
                ></textarea>
                <button 
                  type="submit" 
                  disabled={isSubmittingComment}
                  class="bg-red-600 hover:bg-red-700 font-bold px-6 py-2.5 rounded-xl text-xs transition uppercase tracking-wider flex items-center gap-2 disabled:opacity-50"
                >
                  <i data-lucide="send" class="w-3.5 h-3.5"></i>
                  <span>{isSubmittingComment ? 'Posting...' : 'Post Comment'}</span>
                </button>
              </form>

              {/* Comments List */}
              <div class="space-y-3 pt-2">
                {comments.length === 0 ? (
                  <p class="text-xs text-neutral-500 italic">No comments yet. Be the first Heavy Metal fan to comment!</p>
                ) : (
                  comments.map((item, index) => (
                    <div key={index} class="bg-neutral-950 p-4 rounded-xl border border-neutral-800/60 flex gap-3.5 items-start">
                      <div class="w-10 h-10 rounded-xl bg-neutral-900 border border-neutral-800 p-1 flex-shrink-0 overflow-hidden">
                        <img 
                          src={item.avatar || getRockAvatar(item.name)} 
                          alt={item.name} 
                          class="w-full h-full object-contain"
                        />
                      </div>
                      <div class="flex-1 space-y-1">
                        <div class="flex justify-between items-center">
                          <span class="font-bold text-xs text-red-500">{item.name}</span>
                          <span class="text-[10px] text-neutral-500">{item.date}</span>
                        </div>
                        <p class="text-xs text-neutral-300 leading-relaxed">{item.text}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer class="max-w-4xl mx-auto mt-16 px-4 pt-8 border-t border-neutral-800 text-center space-y-4">
            <div class="flex justify-center gap-6">
              <a href={socialLinks.instagram} target="_blank" rel="noopener noreferrer" class="text-neutral-400 hover:text-white text-xs flex items-center gap-1.5">
                <i data-lucide="instagram" class="w-4 h-4"></i> Instagram
              </a>
              <a href={socialLinks.youtube} target="_blank" rel="noopener noreferrer" class="text-neutral-400 hover:text-red-500 text-xs flex items-center gap-1.5">
                <i data-lucide="youtube" class="w-4 h-4"></i> YouTube (@Brandfer)
              </a>
            </div>
            <p class="text-xs text-neutral-500">© 2026 Marco Brandfer. All rights reserved.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MarcoBrandferApp />);
  </script>
</body>
</html>
