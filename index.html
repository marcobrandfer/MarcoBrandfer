<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marco Brandfer App - Exclusivo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans selection:bg-red-600 selection:text-white pb-12">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function MarcoBrandferApp() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [isRegistered, setIsRegistered] = useState(false);
      const [email, setEmail] = useState('');
      const audioRef = useRef(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [isPlaying, isRegistered]);

      const togglePlay = () => {
        if (audioRef.current) {
          if (isPlaying) {
            audioRef.current.pause();
          } else {
            audioRef.current.play();
          }
          setIsPlaying(!isPlaying);
        }
      };

      const handleRegister = (e) => {
        e.preventDefault();
        if (email) {
          setIsRegistered(true);
        }
      };

      const merchProducts = [
        { id: 1, name: 'Camiseta Oficial MB Rock/Metal', price: 'R$ 89,90', image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500' },
        { id: 2, name: 'Caneca Colecionável Exclusiva', price: 'R$ 45,00', image: 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500' },
        { id: 3, name: 'EP Físico / Edição de Colecionador', price: 'R$ 59,90', image: 'https://images.unsplash.com/photo-1539375665275-f9de415ef9ac?w=500' },
      ];

      return (
        <div class="min-h-screen">
          
          {/* Elemento do Áudio Exclusivo (Caminho para audios/guardian.mp3) */}
          <audio ref={audioRef} src="./audios/guardian.mp3" onEnded={() => setIsPlaying(false)}></audio>

          {/* Header Fixo App */}
          <header class="sticky top-0 z-50 bg-neutral-900/80 backdrop-blur-md border-b border-neutral-800 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
              <i data-lucide="disc" class="w-6 h-6 text-red-600 animate-spin"></i>
              <span class="font-extrabold tracking-wider text-lg uppercase bg-gradient-to-r from-white via-neutral-200 to-neutral-400 bg-clip-text text-transparent">
                Marco Brandfer <span class="text-red-600 text-xs px-2 py-0.5 border border-red-600 rounded-full">APP</span>
              </span>
            </div>
            <a href="#vip" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-full font-bold transition">
              Área VIP
            </a>
          </header>

          {/* Hero Section */}
          <section class="relative bg-neutral-900 border-b border-neutral-800 py-16 px-4 text-center overflow-hidden">
            <div class="relative z-20 max-w-2xl mx-auto space-y-4">
              <span class="inline-flex items-center gap-1.5 text-xs uppercase tracking-widest text-red-500 font-semibold px-3 py-1 bg-red-950/50 border border-red-800 rounded-full">
                🔥 Single Exclusivo
              </span>
              <h1 class="text-3xl md:text-5xl font-black uppercase tracking-tight text-white">
                The Guardian of the Hidden Wisdom
              </h1>
              <p class="text-neutral-400 text-sm md:text-base max-w-md mx-auto">
                Ouça a faixa exclusiva do Marco Brandfer disponível em primeira mão apenas no Web App.
              </p>
              
              {/* Player Nativo */}
              <div class="pt-4 flex justify-center">
                <button 
                  onClick={togglePlay}
                  class="flex items-center gap-3 bg-red-600 hover:bg-red-700 text-white font-bold px-8 py-3.5 rounded-full transition shadow-lg shadow-red-900/30"
                >
                  <i data-lucide={isPlaying ? "pause" : "play"} class="w-5 h-5 fill-white"></i>
                  <span>{isPlaying ? 'Pausar Músia' : 'Ouvir "The Guardian of the Hidden Wisdom"'}</span>
                </button>
              </div>
            </div>
          </section>

          {/* Área VIP / Cadastro para Download */}
          <section id="vip" class="max-w-3xl mx-auto my-12 px-4">
            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 relative overflow-hidden">
              <div class="flex items-center gap-3 mb-4">
                <i data-lucide="music" class="text-red-500 w-6 h-6"></i>
                <h2 class="text-xl md:text-2xl font-bold">Área de Membros VIP</h2>
              </div>

              {!isRegistered ? (
                <div class="space-y-4">
                  <p class="text-neutral-400 text-sm">
                    Cadastre seu e-mail para ter acesso VIP e liberar o download do pacote exclusivo de <strong>The Guardian of the Hidden Wisdom</strong> (.ZIP).
                  </p>
                  <form onSubmit={handleRegister} class="flex flex-col sm:flex-row gap-3 pt-2">
                    <input 
                      type="email" 
                      required
                      placeholder="Digite seu e-mail de fã" 
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      class="bg-neutral-950 border border-neutral-800 text-white px-4 py-3 rounded-xl focus:outline-none focus:border-red-600 flex-1 text-sm"
                    />
                    <button type="submit" class="bg-red-600 hover:bg-red-700 font-bold px-6 py-3 rounded-xl transition text-sm flex items-center justify-center gap-2">
                      <span>Desbloquear Download</span>
                    </button>
                  </form>
                </div>
              ) : (
                <div class="bg-neutral-950/80 border border-green-500/30 p-4 rounded-xl space-y-3">
                  <div class="flex items-center gap-2 text-green-400 font-bold text-sm">
                    <i data-lucide="user-check" class="w-5 h-5"></i> Acesso Liberado!
                  </div>
                  <p class="text-xs text-neutral-400">
                    Seu download está pronto. Clique abaixo para baixar o pacote do single em alta qualidade.
                  </p>
                  {/* Link direto para downloads/guardian.zip */}
                  <a 
                    href="./downloads/guardian.zip" 
                    download="The_Guardian_of_the_Hidden_Wisdom.zip"
                    class="inline-flex items-center gap-2 bg-neutral-100 hover:bg-white text-black font-bold text-xs px-4 py-2.5 rounded-lg transition"
                  >
                    <i data-lucide="download" class="w-4 h-4"></i> Baixar Single Completo (.ZIP)
                  </a>
                </div>
              )}
            </div>
          </section>

          {/* Loja de Colecionáveis */}
          <section class="max-w-4xl mx-auto my-12 px-4">
            <div class="flex items-center gap-3 mb-6">
              <i data-lucide="shopping-bag" class="text-red-500 w-6 h-6"></i>
              <h2 class="text-xl md:text-2xl font-bold">Loja do Fã & Colecionáveis</h2>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
              {merchProducts.map((product) => (
                <div key={product.id} class="bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden flex flex-col justify-between">
                  <div class="h-48 overflow-hidden bg-neutral-950">
                    <img src={product.image} alt={product.name} class="w-full h-full object-cover" />
                  </div>
                  <div class="p-4 space-y-2 flex-1 flex flex-col justify-between">
                    <div>
                      <h3 class="font-bold text-sm text-neutral-200">{product.name}</h3>
                      <p class="text-red-500 font-extrabold text-base pt-1">{product.price}</p>
                    </div>
                    <button class="w-full mt-3 bg-neutral-800 hover:bg-neutral-700 text-xs font-bold py-2.5 rounded-lg border border-neutral-700 transition">
                      Garantir Item
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Footer */}
          <footer class="max-w-4xl mx-auto mt-16 px-4 pt-8 border-t border-neutral-800 text-center space-y-4">
            <p class="text-xs text-neutral-500">© 2026 Marco Brandfer. Todos os direitos reservados.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MarcoBrandferApp />);
  </script>
</body>
</html>
